# Commands for start Garry's Mod server within wsl

tasks:
  default:
    description: Starts new srcds process within wsl
    runner: powershell
    arguments:
      - name: WSL_DISTRO
        default: ${WSL_DISTRO}
      - name: WSL_ENTRYPOINT
        default: ${WSL_DISTRO}
    commands:
      - wsl -d ${WSL_DISTRO} -- bash -c "${WSL_ENTRYPOINT}"